version: '3.8'

services:
  questdb:
    image: questdb/questdb:8.1.0
    ports:
      - "9000:9000" # Web console
      - "9009:9009" # InfluxDB line protocol
      - "8812:8812" # PostgreSQL wire protocol
    volumes:
      - ~/Documents/storage/questdb_data:/root/.questdb # local path mounted to container
    deploy:
      resources:
        limits:
          cpus: '2.0'  # Limit to 2 CPU cores
          memory: 8G   # Limit to 8 GB of RAM
    environment:
      - QDB_HTTP_MIN_ENABLED=true # enable/disable HTTP server
      - QDB_LINE_TCP_MIN_ENABLED=true # enable/disable InfluxDB line protocol
      - QDB_PG_MIN_ENABLED=true # enable/disable PostgreSQL server
      - QDB_SHARED_WORKER_COUNT=6 # maps to shared.worker.count
      - QDB_LINE_TCP_IO_WORKER_COUNT=6 # maps to line.tcp.io.worker.count
      - QDB_CAIRO_WAL_ENABLED_DEFAULT=true # maps to cairo.wal.enabled.default